<style>
:root{--bg:#F2F4F3;--panel:#FFFFFF;--ink:#151A1E;--ink-2:#3A434B;--muted:#5E6973;--rule:#D5DBDD;--accent:#2749C9;--accent-ink:#fff;--bad:#B2302E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1114;--panel:#151A1F;--ink:#E7EAEC;--ink-2:#C2C8CE;--muted:#8C96A0;--rule:#262D34;--accent:#7A93FF;--accent-ink:#0E1114;--bad:#F08383;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1114;--panel:#151A1F;--ink:#E7EAEC;--ink-2:#C2C8CE;--muted:#8C96A0;--rule:#262D34;--accent:#7A93FF;--accent-ink:#0E1114;--bad:#F08383;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif;padding-inline:16px;padding-block:24px}
.gate{width:min(100%,380px);background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:26px 26px 22px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font-size:20px;margin:0 0 6px;font-weight:600;line-height:1.3}
p{margin:0 0 18px;font-size:13.5px;color:var(--muted);line-height:1.6}
label{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;font-size:14px;padding:10px 12px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{margin-top:10px;font-size:13px;color:var(--bad);min-height:1.2em}
small{display:block;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
</style>

  var KEY="cvpr4d-board-pw";
  var $=function(id){return document.getElementById(id)};
  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  function open(pw){
    var enc=new TextEncoder();
    return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    }).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.data)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function enter(pw,remember){
    if(!window.crypto||!crypto.subtle){ $("err").textContent="这个浏览器不支持解密（需要 https）。"; return; }
    $("go").disabled=true; $("err").textContent="";
    open(pw).then(function(html){
      if(remember){ try{ localStorage.setItem(KEY,pw) }catch(e){} }
      document.open(); document.write(html); document.close();
    }).catch(function(){
      $("go").disabled=false; $("err").textContent="口令不对。"; $("pw").select();
      try{ localStorage.removeItem(KEY) }catch(e){}
    });
  }
  $("gate").addEventListener("submit",function(e){ e.preventDefault(); enter($("pw").value,true); });
  try{ var saved=localStorage.getItem(KEY); if(saved) enter(saved,false); }catch(e){}
})();
