name: Publish lightweight board
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-light.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout lightweight site only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/
          persist-credentials: false
      - name: Check publish boundary
        run: |
          test -f web/index.html
          test ! -d web/media
          test ! -d media
          python3 - <<'PYBOUND'
          from pathlib import Path
          root=Path('web')
          files=[p for p in root.rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          assert total < 50_000_000, f'Unexpectedly heavy release: {total} bytes'
          allowed={'.enc','.html','.js','.map'}
          for p in files:
              assert p.name=='.nojekyll' or p.suffix in allowed, f'Unexpected public file: {p}'
          print(f'Lightweight release: {len(files)} files, {total} bytes; no media directory')
          PYBOUND
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload lightweight artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PYREADY'
          import json, os, time, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Cache-Control': 'no-cache'}
          deadline = time.monotonic() + 90
          while True:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == os.environ['ARTIFACT_NAME'] and not a['expired']]
              if len(matches) == 1:
                  print('Uploaded Pages artifact is visible:', matches[0]['id'])
                  break
              if len(matches) > 1:
                  raise SystemExit('Duplicate artifact within the same run attempt')
              if time.monotonic() >= deadline:
                  raise SystemExit('Uploaded artifact is still unavailable after 90 seconds')
              time.sleep(3)
          PYREADY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0: REST artifact lookup, matching readiness check
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
